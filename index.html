<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Essential Meta Tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mishat | Senior Design Verification Engineer</title>
    <meta name="description"
        content="Mishat Hassan – Senior Design Verification Engineer specializing in UVM, SystemVerilog, SoC Validation, and ASIC verification. Explore my portfolio of hardware verification projects and technical expertise." />
    <!-- Open Graph / Social Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mishat | Senior Design Verification Engineer" />
    <meta property="og:description" content="Mishat Hassan – Senior Design Verification Engineer specializing in UVM, SystemVerilog, SoC Validation, and ASIC verification." />
    <meta property="og:image" content="/favicon.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Typography: Preconnects & Google Fonts (Inter + JetBrains Mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS: Runtime Configuration & Custom Design Tokens -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // Map all colors to CSS variables to allow full theme inversion
                        black: 'rgb(var(--color-black) / <alpha-value>)',
                        white: 'rgb(var(--color-white) / <alpha-value>)',
                        obsidian: 'var(--color-obsidian)',
                        electric: 'var(--color-electric)',
                        deepblue: 'var(--color-deepblue)',
                        neonpurple: 'var(--color-neonpurple)',
                        pcbgold: 'var(--color-pcbgold)',
                        success: 'var(--color-success)',
                        error: '#ff0033',
                        gray: {
                            100: 'var(--color-gray-100)',
                            200: 'var(--color-gray-200)',
                            300: 'var(--color-gray-300)',
                            400: 'var(--color-gray-400)',
                            500: 'var(--color-gray-500)',
                            600: 'var(--color-gray-600)',
                            700: 'var(--color-gray-700)',
                            800: 'var(--color-gray-800)',
                            900: 'var(--color-gray-900)',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    backgroundImage: {
                        'grid-pattern': "linear-gradient(to right, var(--color-grid) 1px, transparent 1px), linear-gradient(to bottom, var(--color-grid) 1px, transparent 1px)",
                    }
                }
            }
        }
    </script>
    <style>
        /* -------------------------------------------------------------------------- */
        /*                              Design Tokens                                 */
        /* -------------------------------------------------------------------------- */
        :root {
            /* Base RGB values for Alpha Support */
            --color-black: 0 0 0;
            --color-white: 255 255 255;

            /* Obsidian Theme (Dark Mode Default) */
            --color-obsidian: #050510;
            --color-electric: #00f3ff;
            --color-deepblue: #0a0a1f;
            --color-neonpurple: #b026ff;
            --color-pcbgold: #d4af37;
            --color-success: #00ff41;

            --color-grid: #1f1f3a;

            /* Standard Gray Scale */
            --color-gray-100: #f3f4f6;
            --color-gray-200: #e5e7eb;
            --color-gray-300: #d1d5db;
            --color-gray-400: #9ca3af;
            --color-gray-500: #6b7280;
            --color-gray-600: #4b5563;
            --color-gray-700: #374151;
            --color-gray-800: #1f2937;
            --color-gray-900: #111827;

            /* Data series (skill wafers, trace entry types): neon */
            --series-1: #00f3ff;
            --series-2: #00ff41;
            --series-3: #d4af37;
            --series-4: #b026ff;
            --series-5: #ff6b35;
            --series-6: #ff2d95;
            --series-7: #60a5fa;
            --series-8: #2dd4bf;
        }

        /* -------------------------------------------------------------------------- */
        /*                            Global Body Styles                             */
        /* -------------------------------------------------------------------------- */
        /* Keeps the scrollbar's space reserved while the boot locks scrolling, so the page
           doesn't get 8px narrower (and the hero shift) the moment the boot ends */
        html {
            scrollbar-gutter: stable;
        }

        body {
            background-color: var(--color-obsidian);
            color: rgb(var(--color-white));
            overflow-x: hidden;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        /* Default theme: ClockProbeBackdrop sits behind every section. The footer fades to
           black instead of stopping it at a hard edge, and the translucent cards go
           near-opaque with a blur so text stays readable over it. The leading space / ^=
           keeps hover: variants out; the execution trace cards set their transparent
           background inline when not selected. */
        body:not(.theme-light):not(.theme-silicon) #terminal {
            background: linear-gradient(to top, #000 0%, rgba(0, 0, 0, 0.8) 30%, rgba(5, 5, 16, 0) 100%) !important;
        }
        body:not(.theme-light):not(.theme-silicon) main :is([class*=" bg-gray-900/"], [class^="bg-gray-900/"], [class*=" bg-obsidian/"], [class^="bg-obsidian/"]),
        body:not(.theme-light):not(.theme-silicon) #trace .cursor-pointer.rounded-lg[style*="background: transparent"] {
            background-color: rgba(8, 9, 20, 0.92) !important;
            backdrop-filter: blur(8px);
        }
        body:not(.theme-light):not(.theme-silicon) main [class*="hover:bg-gray-800/"]:hover {
            background-color: rgba(24, 28, 44, 0.96) !important;
        }

        /* -------------------------------------------------------------------------- */
        /*                        Theme: Light (Breadboard)                           */
        /* -------------------------------------------------------------------------- */
        /* Soft sage solderless breadboard: square contact holes, +/- power rails on every
           section, cards as plug-in modules with header pins and a jumper wire. */
        body.theme-light {
            /* Inverted base: Black is the card fill, White is the ink */
            --color-black: 249 250 246;
            --color-white: 62 72 62;

            --color-obsidian: #eef1ea;
            --color-deepblue: #eef1ea;
            --color-electric: #6f9a7a;
            /* Sage */
            --color-neonpurple: #9a8aa6;
            --color-pcbgold: #c9aa6a;
            --color-success: #7ea37e;

            --color-grid: #dde3d6;

            /* Inverted gray scale: 100 is darkest ink, 900 is the card fill */
            --color-gray-100: #3e483e;
            --color-gray-200: #4b564b;
            --color-gray-300: #5c685c;
            --color-gray-400: #748074;
            --color-gray-500: #8e998d;
            --color-gray-600: #748074;
            --color-gray-700: #c3cbbd;
            --color-gray-800: #e0e5da;
            --color-gray-900: #f9faf6;

            /* Data series: muted pastels that sit on the sage board */
            --series-1: #6a9fae;
            --series-2: #7ea37e;
            --series-3: #c9aa6a;
            --series-4: #9a8aa6;
            --series-5: #c98d6e;
            --series-6: #c08a9e;
            --series-7: #8796c0;
            --series-8: #a3a35f;

            counter-reset: bb-sec bb-ref;
            /* Contact holes: the base color shows only where both masks leave a 4px gap */
            background-color: #d5dccf;
            background-image:
                linear-gradient(90deg, transparent 0 4px, #eef1ea 4px),
                linear-gradient(transparent 0 4px, #eef1ea 4px);
            background-size: 18px 18px;
        }

        body.theme-light h1,
        body.theme-light h2,
        body.theme-light h3 {
            letter-spacing: 0;
        }

        /* Rows: each section is labelled and carries +/- rails top and bottom */
        body.theme-light section {
            counter-increment: bb-sec;
            margin: 2.5rem 0;
            padding-top: 5rem !important;
        }

        body.theme-light section::before {
            content: "ROW " counter(bb-sec) "  \00B7  " attr(id);
            position: absolute;
            top: 30px;
            left: 4rem;
            z-index: 5;
            font: 700 10px/1 'JetBrains Mono', monospace;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--color-gray-500);
        }

        body.theme-light section::after {
            content: "+\A\2212";
            white-space: pre;
            position: absolute;
            top: 4px;
            left: 2.6rem;
            right: 2rem;
            bottom: 4px;
            font: 700 9px/11px 'JetBrains Mono', monospace;
            color: var(--color-gray-500);
            pointer-events: none;
            background:
                linear-gradient(rgba(214, 120, 110, 0.55), rgba(214, 120, 110, 0.55)) left 16px top 5px / calc(100% - 16px) 1.5px,
                linear-gradient(rgba(110, 140, 200, 0.55), rgba(110, 140, 200, 0.55)) left 16px top 16px / calc(100% - 16px) 1.5px,
                linear-gradient(rgba(214, 120, 110, 0.55), rgba(214, 120, 110, 0.55)) left 16px bottom 16px / calc(100% - 16px) 1.5px,
                linear-gradient(rgba(110, 140, 200, 0.55), rgba(110, 140, 200, 0.55)) left 16px bottom 5px / calc(100% - 16px) 1.5px;
            background-repeat: no-repeat;
        }

        /* Modules: cards and translucent panels become solid plug-in boards */
        body.theme-light :is(.group, [class*="bg-gray-900/"], [class*="bg-black/"]) {
            counter-increment: bb-ref;
            background: rgb(var(--color-black)) !important;
            border: 1px solid rgba(62, 72, 62, 0.16) !important;
            border-radius: 8px !important;
            box-shadow: 0 2px 0 rgba(62, 72, 62, 0.06), 0 10px 22px -16px rgba(62, 72, 62, 0.45) !important;
            overflow: visible !important;
        }

        /* Header pins along the top edge */
        body.theme-light :is(.group, [class*="bg-gray-900/"], [class*="bg-black/"])::after {
            content: "";
            position: absolute;
            top: -5px;
            left: 18px;
            width: min(120px, 40%);
            height: 7px;
            pointer-events: none;
            background: repeating-linear-gradient(90deg, var(--color-pcbgold) 0 6px, transparent 6px 10px);
            border-radius: 1px;
        }

        /* Jumper wire, alternating coral and blue */
        body.theme-light :is(.group, [class*="bg-gray-900/"], [class*="bg-black/"])::before {
            content: "";
            position: absolute;
            top: -16px;
            right: 26px;
            width: 54px;
            height: 16px;
            pointer-events: none;
            z-index: 5;
            border: 2px solid rgba(214, 140, 120, 0.7);
            border-bottom: 0;
            border-radius: 30px 30px 0 0;
        }

        body.theme-light :is(.group, [class*="bg-gray-900/"], [class*="bg-black/"]):nth-child(even)::before {
            border-color: rgba(120, 150, 200, 0.7);
            width: 38px;
        }

        /* Tree-row hover classes match the module rule, but the rows aren't positioned, so their
           wires and pins would float above the section header. */
        body.theme-light .verification-topology button::before,
        body.theme-light .verification-topology button::after {
            content: none !important;
        }

        body.theme-light :is(.group, [class*="bg-gray-900/"], [class*="bg-black/"]):hover {
            border-color: var(--color-electric) !important;
            box-shadow: 0 0 0 3px rgba(111, 154, 122, 0.15), 0 14px 26px -16px rgba(62, 72, 62, 0.5) !important;
        }

        /* Round panels (the coverage wafer) stay round and skip module decorations */
        body.theme-light .rounded-full[class*="bg-gray-900/"] {
            border-radius: 9999px !important;
        }

        body.theme-light .rounded-full[class*="bg-gray-900/"]::before,
        body.theme-light .rounded-full[class*="bg-gray-900/"]::after {
            content: none !important;
        }

        body.theme-light .border-gray-800 {
            border-color: rgba(62, 72, 62, 0.18) !important;
        }

        body.theme-light svg {
            color: var(--color-electric);
        }

        /* Solid fills so the holes don't show through: trace log cards and the coverage slot rack */
        body.theme-light #trace .rounded-lg.border.p-5,
        body.theme-light #coverage [class*="bg-obsidian/80"] {
            background: rgb(var(--color-black)) !important;
            box-shadow: 0 2px 0 rgba(62, 72, 62, 0.06), 0 10px 22px -16px rgba(62, 72, 62, 0.45);
        }

        body.theme-light #trace .rounded-lg.border.p-5 {
            position: relative;
            transition: box-shadow 0.25s ease, border-color 0.25s ease;
        }

        body.theme-light #coverage .border-electric {
            background: rgba(111, 154, 122, 0.12);
        }

        /* Selected trace card plugs in like a DIP chip: notch on top, pin legs both sides */
        body.theme-light #trace .rounded-lg.border.p-5[style*="--color-electric"] {
            border-color: rgba(62, 72, 62, 0.55) !important;
            border-width: 1.5px !important;
            box-shadow: 0 16px 30px -18px rgba(62, 72, 62, 0.55) !important;
        }

        body.theme-light #trace .rounded-lg.border.p-5[style*="--color-electric"]::before {
            content: "";
            position: absolute;
            top: -1.5px;
            left: 50%;
            transform: translateX(-50%);
            width: 22px;
            height: 11px;
            pointer-events: none;
            border: 1.5px solid rgba(62, 72, 62, 0.55);
            border-top: 0;
            border-radius: 0 0 22px 22px;
            background: var(--color-obsidian);
        }

        body.theme-light #trace .rounded-lg.border.p-5[style*="--color-electric"]::after {
            content: "";
            position: absolute;
            top: 14px;
            bottom: 14px;
            left: -8px;
            right: -8px;
            pointer-events: none;
            background:
                repeating-linear-gradient(180deg, #b3bcb0 0 5px, transparent 5px 16px) left / 7px 100% no-repeat,
                repeating-linear-gradient(180deg, #b3bcb0 0 5px, transparent 5px 16px) right / 7px 100% no-repeat;
        }

        /* CyberText carries .group; the hero name stays on the board, not in a module card */
        body.theme-light #top .group {
            background: transparent !important;
            border-color: transparent !important;
            box-shadow: none !important;
        }

        body.theme-light #top .group::before,
        body.theme-light #top .group::after {
            content: none !important;
        }

        /* Component Specific Overrides for Light Mode */
        body.theme-light .glow-text {
            color: var(--color-electric) !important;
            text-shadow: 0 1px 0 #fff;
        }

        body.theme-light .mix-blend-screen {
            mix-blend-mode: normal !important;
        }

        body.theme-light input {
            caret-color: #6f9a7a;
        }

        /* Fix placeholder contrast */
        body.theme-light .placeholder-gray-600::placeholder {
            color: #8e998d !important;
        }

        /* -------------------------------------------------------------------------- */
        /*                       Theme: Silicon (X-Ray/Schematic)                     */
        /* -------------------------------------------------------------------------- */
        /* Silicon X-Ray Theme - RTL/Gate Level Schematic Aesthetic */
        body.theme-silicon {
            --color-obsidian: #000800;
            --color-electric: #39ff14;
            /* Neon Green */
            --color-deepblue: #001a00;
            --color-neonpurple: #00ff00;
            --color-pcbgold: #ccff00;
            --color-success: #00ff33;

            --color-gray-100: #e0ffe0;
            --color-gray-200: #ccffcc;
            --color-gray-300: #99ff99;
            --color-gray-400: #66cc66;
            --color-gray-500: #339933;
            --color-gray-600: #226622;
            --color-gray-700: #114411;
            --color-gray-800: #0a2a0a;
            --color-gray-900: #051505;

            /* Data series: phosphor brightness steps, palest to deepest */
            --series-1: #e6ffd9;
            --series-2: #c2ffa8;
            --series-3: #9cff78;
            --series-4: #6cff3a;
            --series-5: #39ff14;
            --series-6: #2bcc0f;
            --series-7: #1f990b;
            --series-8: #146608;

            /* RtlRainBackdrop draws the page background */
            background-color: #000500;
        }

        /* Over RtlRainBackdrop the footer fades to black instead of cutting it off, and the
           translucent cards (whose /opacity classes don't render with the theme's CSS-variable
           colours) get a near-opaque phosphor-black fill and a blur, as in the Default theme. */
        body.theme-silicon #terminal {
            background: linear-gradient(to top, #000500 0%, rgba(0, 5, 0, 0.85) 30%, rgba(0, 8, 0, 0) 100%) !important;
        }
        body.theme-silicon main :is([class*=" bg-gray-900/"], [class^="bg-gray-900/"], [class*=" bg-obsidian/"], [class^="bg-obsidian/"]),
        body.theme-silicon #trace .cursor-pointer.rounded-lg[style*="background: transparent"] {
            background-color: rgba(0, 14, 2, 0.92) !important;
            backdrop-filter: blur(6px);
        }
        body.theme-silicon main [class*="hover:bg-gray-800/"]:hover {
            background-color: rgba(0, 32, 6, 0.96) !important;
        }

        body.theme-silicon * {
            border-radius: 0 !important;
            font-family: 'JetBrains Mono', monospace !important;
            box-shadow: none !important;
            letter-spacing: 0.05em;
        }

        body.theme-silicon div {
            border-color: rgba(0, 255, 0, 0.2);
        }

        /* Module Boundaries */
        body.theme-silicon section {
            border: 1px dashed var(--color-gray-600);
            position: relative;
            margin-top: 2rem;
            margin-bottom: 2rem;
            background: rgba(0, 20, 0, 0.3);
            overflow: visible !important;
        }

        body.theme-silicon section::before {
            content: "module " attr(id) " ();";
            position: absolute;
            top: -10px;
            left: 10px;
            background: var(--color-obsidian);
            color: var(--color-electric);
            border: 1px solid var(--color-electric);
            padding: 0 8px;
            font-size: 12px;
            z-index: 50;
            font-weight: bold;
        }

        body.theme-silicon section::after {
            content: "endmodule // " attr(id);
            position: absolute;
            bottom: -10px;
            right: 10px;
            background: var(--color-obsidian);
            color: var(--color-electric);
            border: 1px solid var(--color-electric);
            padding: 0 8px;
            font-size: 12px;
            font-weight: bold;
        }

        /* Logic Gates / Instances (Cards) */
        body.theme-silicon .group {
            border: 2px solid var(--color-gray-600) !important;
            background: rgba(0, 30, 0, 0.95) !important;
            position: relative;
            overflow: visible !important;
            /* Show pins */
            transition: all 0.1s steps(2);
        }

        body.theme-silicon .group:hover {
            border-color: var(--color-electric) !important;
            z-index: 10;
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0px var(--color-electric) !important;
        }

        /* Simulated Input/Output Pins */
        body.theme-silicon .group::before {
            content: "I";
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            color: var(--color-obsidian);
            font-weight: bold;
            position: absolute;
            top: 20%;
            left: -8px;
            width: 8px;
            height: 8px;
            background: var(--color-electric);
            border: 1px solid var(--color-electric);
        }

        body.theme-silicon .group::after {
            content: "O";
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            color: var(--color-obsidian);
            font-weight: bold;
            position: absolute;
            bottom: 20%;
            right: -8px;
            width: 8px;
            height: 8px;
            background: var(--color-electric);
            border: 1px solid var(--color-electric);
        }

        /* Force high contrast borders in silicon mode for better wireframe look */
        body.theme-silicon .border-gray-800 {
            border-color: rgba(0, 255, 0, 0.3) !important;
        }

        /* Typography */
        body.theme-silicon h1,
        body.theme-silicon h2,
        body.theme-silicon h3,
        body.theme-silicon span {
            text-transform: uppercase;
        }

        /* -------------------------------------------------------------------------- */
        /*                            UI Customization                                */
        /* -------------------------------------------------------------------------- */
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--color-obsidian);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--color-gray-800);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--color-electric);
        }

        .glow-text {
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        body.theme-silicon .glow-text {
            text-shadow: 0 0 8px rgba(57, 255, 20, 0.8);
            color: #39ff14 !important;
        }

        /* Scanline overlay for CRT effect */
        body.theme-silicon::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 9999;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        /* Wire connections for timeline */
        body.theme-silicon .border-l-2 {
            border-left: 2px solid var(--color-electric) !important;
            border-style: steps(2) !important;
        }

        /* Hide background gradients in cards for cleaner schematic look */
        body.theme-silicon .bg-gradient-to-br {
            opacity: 0;
        }

        /* Icons flat color */
        body.theme-silicon svg {
            color: var(--color-electric) !important;
            filter: drop-shadow(0 0 2px var(--color-electric));
        }

        /* Section header port tag (SectionHeader.tsx): its icon sits on solid green */
        body.theme-silicon .silicon-port svg {
            color: #000500 !important;
            filter: none;
        }

        /* Section header, Default theme: an iridescent title that flickers on, bobs, and a
           pinging probe pad (SectionHeader.tsx) */
        .holo-text {
            background: linear-gradient(100deg, #e6feff 0%, #7ff9ff 30%, #dcb8ff 50%, #7ff9ff 70%, #e6feff 100%);
            background-size: 250% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 10px rgba(0, 243, 255, 0.35));
            animation: holo-shift 9s linear infinite;
        }
        @keyframes holo-shift { to { background-position: -250% 0; } }

        .holo-flicker { animation: holo-flicker 0.7s steps(1) 1; }
        @keyframes holo-flicker {
            0% { opacity: 0; } 15% { opacity: 0.8; } 25% { opacity: 0.1; }
            40% { opacity: 1; } 55% { opacity: 0.4; } 70%, 100% { opacity: 1; }
        }

        .holo-bob { animation: holo-bob 5s ease-in-out infinite; }
        @keyframes holo-bob { 50% { transform: translateY(-4px); } }

        .probe-ping { animation: probe-ping 2.4s ease-out infinite; }
        @keyframes probe-ping {
            0% { transform: scale(0.6); opacity: 0.9; }
            80%, 100% { transform: scale(2.4); opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            .holo-text, .holo-flicker, .holo-bob, .probe-ping { animation: none; }
        }

        /* Enforce Custom Cursor Only on Desktop */
        @media (min-width: 768px) {
            * {
